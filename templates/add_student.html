{% extends "base.html" %}

{% block title %}
Add Student
{% endblock %}

{% block content %}

<div class="form-box">

    <h2>Add Student</h2>

    <form method="POST" action="/add-student">

        <div class="form-group">
            <label>Student Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter Student Name"
                required>
        </div>

        <div class="form-group">
            <label>Roll Number</label>
            <input
                type="text"
                name="roll_no"
                placeholder="Enter Roll Number"
                required>
        </div>

        <div class="form-group">
            <label>Department</label>
            <input
                type="text"
                name="department"
                placeholder="Enter Department"
                required>
        </div>

        <div class="form-group">
            <label>Year</label>
            <input
                type="number"
                name="year"
                min="1"
                max="4"
                placeholder="Enter Year"
                required>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input
                type="text"
                name="phone"
                placeholder="Enter Phone Number">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter Email">
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea
                name="address"
                rows="4"
                placeholder="Enter Address"></textarea>
        </div>

        <button class="btn" type="submit">
            Save Student
        </button>

    </form>

</div>

{% endblock %}
