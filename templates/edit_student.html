{% extends "base.html" %}

{% block title %}Edit Student{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">
            <h3>Edit Student</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Student Name</label>
                    <input
                        type="text"
                        class="form-control"
                        name="name"
                        value="{{ student.name }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Roll Number</label>
                    <input
                        type="text"
                        class="form-control"
                        name="roll_no"
                        value="{{ student.roll_no }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <input
                        type="text"
                        class="form-control"
                        name="department"
                        value="{{ student.department }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Year</label>
                    <input
                        type="number"
                        class="form-control"
                        name="year"
                        value="{{ student.year }}"
                        min="1"
                        max="5"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input
                        type="text"
                        class="form-control"
                        name="phone"
                        value="{{ student.phone }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        name="email"
                        value="{{ student.email }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>

                    <textarea
                        class="form-control"
                        name="address"
                        rows="3">{{ student.address }}</textarea>
                </div>

                <button
                    type="submit"
                    class="btn btn-warning">

                    Update Student

                </button>

                <a
                    href="/students"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
