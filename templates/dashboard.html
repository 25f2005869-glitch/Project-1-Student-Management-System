{% extends "base.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<div class="dashboard">

    <h1>Dashboard</h1>

    <p>
        Welcome,
        <strong>{{ session.get('username', 'User') }}</strong>
    </p>

    <div class="card-container">

        <div class="card">
            <h2>Total Students</h2>
            <h3>0</h3>
        </div>

        <div class="card">
            <h2>Add Student</h2>
            <a href="/add-student" class="btn">
                Add
            </a>
        </div>

        <div class="card">
            <h2>View Students</h2>
            <a href="/students" class="btn">
                View
            </a>
        </div>

        <div class="card">
            <h2>Search Student</h2>
            <a href="/students" class="btn">
                Search
            </a>
        </div>

    </div>

</div>

{% endblock %}
